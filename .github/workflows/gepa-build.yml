name: GEPA Build

on:
  push:
    branches: ["main", "feat/**"]
  workflow_dispatch:

concurrency:
  group: gepa-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build v4 and package standalone bundle
    timeout-minutes: 120
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:4000
      NEXT_PUBLIC_V0_URL: https://v0.dev
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build v4 (workspace packages + registry + next build)
        run: pnpm --filter=v4 build
        env:
          BUILD_STANDALONE: "1"
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Assemble standalone bundle
        working-directory: apps/v4
        run: |
          set -euo pipefail
          server="$(find .next/standalone -name server.js -type f | head -n 1)"
          if [ -z "$server" ]; then
            echo "server.js not found under .next/standalone" >&2
            exit 1
          fi
          app_dir="$(dirname "$server")"
          echo "APP_DIR=$app_dir" >> "$GITHUB_ENV"
          rm -rf "$app_dir/public" "$app_dir/.next/static"
          cp -r public "$app_dir/public"
          cp -r .next/static "$app_dir/.next/static"
          du -sh .next/standalone

      # The standalone tree keeps pnpm's symlink layout: apps/v4/node_modules/next
      # resolves its deps through .pnpm neighbor dirs. tar --dereference flattens
      # those links, which breaks that resolution after extraction on Windows
      # ("Cannot find module '@swc/helpers/...'"). pnpm's hidden hoisted store
      # (node_modules/.pnpm/node_modules) is resolvable from the bundle root by
      # design, so hoisting its entries up to node_modules/ makes the flattened
      # tree self-contained.
      #
      # The store entries are symlinks whose targets are relative to
      # .pnpm/node_modules, so a plain `cp -r` up one level leaves DANGLING links
      # and the later `cp -rL` flatten aborts with "cannot stat". Materialize each
      # entry as real files instead: drop the existing top-level entry, then copy
      # with -L so the symlink chain is followed.
      - name: Materialize hoisted deps for symlink-free bundle
        working-directory: apps/v4/.next/standalone
        run: |
          set -euo pipefail
          if [ ! -d node_modules/.pnpm/node_modules ]; then
            echo "no .pnpm hoisted store found" >&2
            exit 1
          fi
          count=0
          for entry in node_modules/.pnpm/node_modules/*; do
            [ -e "$entry" ] || continue
            name="$(basename "$entry")"
            rm -rf "node_modules/$name"
            cp -aL "$entry" "node_modules/$name"
            count=$((count + 1))
          done
          echo "materialized $count hoisted entries as real files"
          ls node_modules | wc -l

      # cp -rL flattens the remaining pnpm symlink farm into plain real files.
      # Tarring the original tree with --dereference races with tar's link
      # bookkeeping ("File removed before we read it"), and re-extracted link
      # entries are useless on Windows anyway. Resolution from the flat copy
      # works because the materialize step above put every runtime package at
      # node_modules top level as real files.
      - name: Flatten bundle into real files
        working-directory: apps/v4
        run: |
          set -euo pipefail
          # Defensive: remove any dangling symlinks (e.g. platform-specific
          # optional deps missing on linux) so cp -L never aborts on them.
          find .next/standalone -xtype l -print -delete
          rm -rf "$RUNNER_TEMP/v4-bundle"
          cp -rL .next/standalone "$RUNNER_TEMP/v4-bundle"
          if find "$RUNNER_TEMP/v4-bundle" -type l | grep -q .; then
            echo "symlinks remain after flatten:" >&2
            find "$RUNNER_TEMP/v4-bundle" -type l | head >&2
            exit 1
          fi
          du -sh "$RUNNER_TEMP/v4-bundle"

      - name: Write run instructions into bundle
        run: |
          cat > "$RUNNER_TEMP/v4-bundle/RUN.md" <<'EOF'
          # Standalone build of apps/v4 (shadcn/ui docs + GEPA pages)

          The GitHub artifact zip holds a single v4-standalone.tar.gz. Extract it
          first (Windows: `tar -xzf v4-standalone.tar.gz`), then from the
          extracted folder:

            Linux/macOS:  PORT=4000 node apps/v4/server.js
            PowerShell:   $env:PORT=4000; node apps/v4/server.js
            cmd:          set PORT=4000 && node apps/v4\server.js

          Then open http://localhost:4000
          EOF

      - name: Smoke test the flattened bundle
        run: |
          set -euo pipefail
          server="$(find "$RUNNER_TEMP/v4-bundle" -name server.js -not -path '*/node_modules/*' -type f | head -n 1)"
          cd "$(dirname "$server")"
          PORT=4123 HOSTNAME=127.0.0.1 node server.js > "$RUNNER_TEMP/next-standalone.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:4123/; then
              break
            fi
            sleep 2
            if [ "$i" = "60" ]; then
              echo "server did not answer within 120s" >&2
              cat "$RUNNER_TEMP/next-standalone.log" || true
              exit 1
            fi
          done
          curl -sf -o /dev/null http://127.0.0.1:4123/
          curl -sf -o /dev/null http://127.0.0.1:4123/docs
          echo "smoke test passed: / and /docs served"

      - name: Package bundle into a single tar.gz
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/v4-standalone.tar.gz" -C "$RUNNER_TEMP/v4-bundle" .
          ls -lh "$RUNNER_TEMP/v4-standalone.tar.gz"

      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: v4-standalone
          path: ${{ runner.temp }}/v4-standalone.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Job summary
        run: |
          {
            echo "## GEPA Build"
            echo "- commit: \`${{ github.sha }}\`"
            echo "- artifact: \`v4-standalone\` — download, unzip, \`tar -xzf v4-standalone.tar.gz\`, then run \`PORT=4000 node apps/v4/server.js\`"
          } >> "$GITHUB_STEP_SUMMARY"
